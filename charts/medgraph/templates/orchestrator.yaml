apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "medgraph.fullname" . }}-orchestrator
  labels:
    {{- include "medgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        {{- include "medgraph.labels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: orchestrator
          image: "{{ .Values.orchestrator.image.repository }}:{{ .Values.orchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.port }}
          env:
            - name: PORT
              value: {{ .Values.orchestrator.port | quote }}
            {{- range $name, $value := .Values.orchestrator.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.orchestrator.secretEnv.enabled }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orchestrator.secretEnv.name }}
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orchestrator.secretEnv.name }}
                  key: OPENAI_API_KEY
                  optional: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medgraph.fullname" . }}-orchestrator
  labels:
    {{- include "medgraph.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: {{ .Values.orchestrator.port }}
      targetPort: http
