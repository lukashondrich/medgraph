abstract: 'Background: Lactic acid (protonated lactate) has broad antimicrobial activity. Vaginal lactobacilli
  produce lactic acid, and are known to confer protection against reproductive tract infections when they
  are predominant in the vaginal microbiota. Using novel ex vivo methods, we showed that cervicovaginal
  fluid (CVF) from women with a predominantly lactobacilli-morphotype microbiota contains significantly
  more lactic acid than previously thought, sufficient to inactivate reproductive tract pathogens. Here,
  we measured vaginal pH in vivo in 20 women with a predominantly lactobacilli-morphotype (low Nugent
  score) microbiota. We also investigated the in vitro production of protons (as hydrogen ions) and lactate
  by vaginal lactobacilli. Results: The average vaginal pH in these women was 3.80 ± 0.20, and the average
  lactate concentration was 0.79% ± 0.22% w/v, with pH and lactate concentration tightly correlated for
  each sample. In vitro, lactobacilli cultured from these CVF samples reached an average pH of 3.92 ±
  0.22, but the average lactate concentration was only 0.14% ± 0.06% w/v, approximately five-fold less
  than in the corresponding CVF samples. When the pH of the cultures was raised, lactate and hydrogen
  ion production resumed, indicating that production of lactate and hydrogen ions by vaginal lactobacilli
  is limited primarily by their sensitivity to hydrogen ion concentration (low pH) not lactate concentration.
  Conclusions: Some vaginal lactobacilli cultures have a lower limiting pH than others, and limiting pHs
  in vitro showed good correlation with pHs measured in vivo. The limiting pH of the lactobacilli predominant
  in a woman''s vaginal microbiota seems critical in determining the concentration of antimicrobial lactic
  acid protecting her.'
