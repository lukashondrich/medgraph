key_finding: In postmenopausal women treated with vaginal estradiol, changes in vaginal pH significantly
  correlated with vaginal cell maturation, epithelial physical changes, and symptoms of dryness and dyspareunia.
abstract: 'Objective: The aim of the study was to determine the utility of vaginal pH as a marker of menopause
  and vulvar and vaginal atrophy (VVA) before and after local estrogen treatment. Methods: Vaginal pH
  was determined using standard pH paper strips in two clinical trials involving postmenopausal women
  with signs and symptoms of VVA evaluated before and after intervention with vaginal estradiol in softgel
  capsules. The utility of vaginal pH was evaluated as a screening method for VVA due to menopause and
  correlations were analyzed between vaginal pH and VVA symptoms, physical changes, and maturation of
  the vaginal epithelium. Results: Changes in vaginal pH were significantly correlated with changes in
  superficial and parabasal cell counts; vaginal epithelial changes of color, integrity, thickness, and
  secretion; and the VVA symptoms of vaginal dryness and dyspareunia (vaginal pain with intercourse).
  Conclusions: Vaginal pH consistently correlated with parabasal and superficial cells and the visual
  vaginal epithelial changes and symptoms of dryness and dyspareunia, and is thus a simple outpatient
  procedure that reflects the hormonal milieu and its effects on the vaginal epithelium.'
