key_finding: In this early-pregnancy cohort, asymptomatic BV prevalence was high and BV (or elevated vaginal
  pH) was not significantly associated with spontaneous preterm delivery.
abstract: 'Background: Bacterial vaginosis (BV) increases the risk of spontaneous preterm deliveries (PD)
  in developed countries. Its prevalence varies with ethnicity, socioeconomic conditions and gestational
  age. Aerobic vaginitis (AV) has also been implicated with spontaneous PD. The present study aimed to
  estimate the prevalence of asymptomatic BV, the accuracy of vaginal pH level to predict BV and to estimate
  the risk of spontaneous PD = 4.5 were collected to determine the Nugent score; a sample of those smears
  was also classified according to a modified Donders'' score. Primary outcomes were spontaneous PD 4.5
  and = > 5.0 to predict BV status was 100% and 82%, correspondingly; the 5.0 cutoff value doubled the
  specificity, from 41% to 84%. The incidence of 4.5 was 3.8%. The RR of spontaneous PD =4.5, as compared
  with those with intermediate state, were 1.24 and 1.86, respectively (Fisher''s exact test, p value
  = 1; 0.52, respectively, both ns). No spontaneous case of PD or abortion was associated with severe
  or moderate AV. Conclusions: A high prevalence of asymptomatic BV was observed without statistically
  significant difference between black and white women. The RRs of spontaneous PD < 34 and <37 weeks among
  women with BV, as compared with those with intermediate state were not statistically significant but
  were consistent with those found in the literature.'
