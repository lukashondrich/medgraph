key_finding: Vaginal pH showed similar sensitivity to follicle-stimulating hormone for diagnosing menopause,
  and estrogen therapy lowered vaginal pH in menopausal women.
abstract: 'Objective: This paper is intended to demonstrate whether vaginal pH value is associated with
  menopausal status and symptoms, to review the sensitivity of follicle-stimulating hormone or vaginal
  pH to diagnose menopause, to compare these findings to a group of practice patients, and to determine
  whether vaginal pH could be used in place of follicle-stimulating hormone as an initial screen to determine
  menopause. Study design: Sixteen studies regarding vaginal pH and menopausal symptoms before and after
  estrogen administration were analyzed. Two epidemiologic studies that reported follicle-stimulating
  hormone or vaginal pH with menopause were reviewed. These findings were compared with similar data from
  the practice of one of the authors (J.C.C.). Results: Menopausal women who do not receive estrogen therapy
  have a weighted average vaginal pH of 6.0, which is reduced significantly to 4.5 with estrogen therapy.
  To diagnose menopause, follicle-stimulating hormone >or=15 or >or=20 mIU/mL in the Third National Health
  and Nutrition Examination Survey had a sensitivity of 65% to 68%. In a study in Costa Rica, where 3
  definitions of menopause were used, a pH of >5.0 had a sensitivity of 64% to 67%. From the practice
  patients, the 95% confidence interval sensitivities and positive predictive values of vaginal pH and
  follicle-stimulating hormone to diagnose menopause overlapped, while a pH 4.5 indicates menopause, because
  it demonstrates a similar sensitivity as follicle-stimulating hormone in epidemiologic studies. In the
  practice patients, the sensitivity of follicle-stimulating hormone was no different than vaginal pH
  in the diagnosis of menopause. Furthermore, with estrogen therapy, a vaginal pH of <or=4.5 indicates
  a mid follicular phase estradiol.'
