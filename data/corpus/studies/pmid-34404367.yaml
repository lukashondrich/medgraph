abstract: 'Background: The most common pathological cause of abnormal vaginal discharge in reproductive-aged
  women is bacterial vaginosis (BV). Amsel''s criteria and Nugent scoring systems are commonly employed
  approaches for the diagnosis of BV. Despite the Nugent scoring system being the gold standard method
  for diagnosing BV, Amsel''s criteria are generally preferred in clinical setup owing to the fact Nugent
  scoring requires considerable time and expert microscopist. This study was conducted to determine the
  diagnostic value of Amsel''s criteria by comparing it with the Nugent scoring system. Methods: This
  was a descriptive cross-sectional study conducted at Tribhuvan University Teaching Hospital, Nepal from
  October 2016 to September 2017. Vaginal specimens were collected from a total of 141 women presenting
  with abnormal vaginal discharge. The sensitivity, specificity, positive predictive value, and negative
  predictive value of Amsel''s criteria were calculated, and each component of Amsel''s criteria was compared
  to the Nugent scoring system. Results: The sensitivity, specificity, positive predictive value, and
  negative predictive value of Amsel''s criteria were 50%, 98.2%, 87.5%, and 88.8% respectively. The clue
  cells showed 100% specificity and vaginal discharge with pH > 4.5 had 89.3% sensitivity while compared
  with Nugent''s scoring system. Conclusions: Amsel''s criteria can be used as an adjunct method to Nugent
  scoring for the diagnosis of BV in the hands of skilled manpower in resources limited countries. The
  presence of clue cell and positive whiff test of Amsel''s criteria shows good match with Nugent''s score.'
