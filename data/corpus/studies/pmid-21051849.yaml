key_finding: Vaginal pH screening with early diagnosis and treatment of abnormal vaginal flora was associated
  with lower very preterm birth and very low birth weight rates versus controls.
abstract: Abnormal vaginal flora as well as bacterial vaginosis have a significant relative risk for miscarriage
  or preterm birth of 1.4-6.9. In the initial Erfurt trial, 0.3% of the neonates with gestational age
  <32+0 weeks were seen in an intervention group vs. 3.3% (p < 0.01) in the control group; in the larger
  Thuringia campaign, the figures were 0.94 vs. 1.36% (p < 0.01). The rate of newborns <1,000 g was reduced
  to 0.38%, the lowest incidence ever seen in any of the German states. This should count even more, as
  there was no success in reducing the rate of low-birth-weight children in the decades preceding these
  prospective studies. However, after discontinuation of the campaign in 2000, the preterm birth rates
  mounted in 2005 in our hospital and the state to the same rate as prior to the programme.
