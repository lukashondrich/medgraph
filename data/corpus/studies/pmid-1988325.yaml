key_finding: In frequent wet smears, vaginal leucocytosis usually occurred once each menstrual cycle in
  healthy women, so it should be considered when assessing smears for infection.
abstract: A higher proportion white blood cells (WBC) than vaginal epithelial cells in wet smears has
  been accepted as a sign which, together with clinical signs, can be useful in the diagnosis of infections
  in the genital tract such as cervicitis or salpingitis. However, little is known about the normal variation
  among healthy women without any symptoms or signs of genital-tract infection. By taking frequent wet
  smears from three healthy asymptomatic women during four menstrual cycles we found that vaginal leucocytosis
  usually occurred once each cycle. Normal vaginal leucocytosis must thus be taken into consideration
  when evaluating wet smear of patients for genital tract infections.
