abstract: The incidence of preterm birth exceeds 10% worldwide. There are significant disparities in the
  frequency of preterm birth among populations within countries, and women of African ancestry disproportionately
  bear the burden of risk in the United States. In the present study, we report a community resource that
  includes 'omics' data from approximately 12,000 samples as part of the integrative Human Microbiome
  Project. Longitudinal analyses of 16S ribosomal RNA, metagenomic, metatranscriptomic and cytokine profiles
  from 45 preterm and 90 term birth controls identified harbingers of preterm birth in this cohort of
  women predominantly of African ancestry. Women who delivered preterm exhibited significantly lower vaginal
  levels of Lactobacillus crispatus and higher levels of BVAB1, Sneathia amnii, TM7-H1, a group of Prevotella
  species and nine additional taxa. The first representative genomes of BVAB1 and TM7-H1 are described.
  Preterm-birth-associated taxa were correlated with proinflammatory cytokines in vaginal fluid. These
  findings highlight new opportunities for assessment of the risk of preterm birth.
