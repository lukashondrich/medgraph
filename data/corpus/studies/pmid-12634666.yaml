key_finding: Vaginal pH ≥5.0, or pH ≥4.5 with Nugent score 9–10, predicted higher risk of subsequent preterm
  birth and low birth weight.
abstract: 'Objective: The study was undertaken to identify early pregnancy vaginal markers predictive
  of subsequent preterm birth. Study design: In a multicenter Bacterial Vaginosis (BV) Trial, 21,554 women
  were screened with a vaginal pH and of these, two populations were studied. These included 12,041 who
  had a pregnancy outcome in the database and 6838 women who had a vaginal pH of 4.5 or greater and a
  Gram stain score and a pregnancy outcome in the database. ColorpHast Indicator Strips were used to determine
  the vaginal pH and the Nugent criteria were used to determine a vaginal Gram stain score of 0 to 10.
  Results: Delivery at or =50 ng/mL (P or =50 mg/mL did not differ by Gram stain score. Conclusion: Women
  with a vaginal pH of 5.0 or greater or a vaginal pH of 4.5 or greater and a Gram stain score of 9 to
  10 had significantly increased preterm births at <37, <35, and 32 weeks'' gestation and/or a birth weight
  less than 2500 g or less than 1500 g.'
