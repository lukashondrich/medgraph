abstract: 'Background: Vaginal pH is related to genital tract inflammation and changes in the bacterial
  flora, both suggested cofactors for persistence of human papillomavirus (HPV) infection. To evaluate
  the relationship between vaginal pH and HPV, we analyzed data from our large population-based study
  in Guanacaste, Costa Rica. We examined vaginal pH and the risk of HPV infection, cytological abnormalities,
  and C. trachomatis infection. Methods: Our study included 9,165 women aged 18-97 at enrollment with
  a total of 28,915 visits (mean length of follow-up = 3.4 years). Generalized estimating equations were
  used to evaluate the relationship between vaginal pH and HPV infection (both overall and single versus
  multiple types) and low-grade squamous intraepithelial lesions (LSIL), the cytomorphic manifestation
  of HPV infection. The relationship between enrollment vaginal pH and C. trachomatis infection was assessed
  by logistic regression. Results were stratified by age at visit. Results: Detection of HPV was positively
  associated with vaginal pH, mainly in women < 35 years (p-trend = 0.009 and 0.007 for women aged < 25
  and 25-34 years, respectively). Elevated vaginal pH was associated with 30% greater risk of infection
  with multiple HPV types and with LSIL, predominantly in women younger than 35 and 65+ years of age.
  Detection of C. trachomatis DNA was associated with increased vaginal pH in women < 25 years (OR 2.2
  95% CI 1.0-5.0). Conclusions: Our findings suggest a possible association of the cervical microenvironment
  as a modifier of HPV natural history in the development of cervical precancer and cancer. Future research
  should include studies of vaginal pH in a more complex assessment of hormonal changes and the cervicovaginal
  microbiome as they relate to the natural history of cervical neoplasia.'
