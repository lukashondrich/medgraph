abstract: 'Objectives: To determine whether patients can understand and use the vaginal pH device in the
  diagnosis of vaginitis. To compare whether vaginal pH readings determined by patients and healthcare
  providers are similar. To determine whether vaginal pH can reduce inappropriate over-the-counter (OTC)
  antifungal medication use and improve the correct diagnosis of vaginitis. Methods: One hundred and fifty-one
  women indicated their belief about the cause of their vaginal infection, read the instructions of the
  vaginal pH device package insert, used the device and interpreted the findings. The patient interpretations
  were compared with results obtained by healthcare providers, blinded to patient findings. Results: Over
  96% of patients stated that they could easily read the instructions, use the vaginal pH device and interpret
  the readings. They obtained the same readings as healthcare professionals (Kappa = 0.9). Restricting
  the use of OTC antifungal medications to those individuals with vaginitis symptoms and vaginal pH 4.5,
  leads to correct diagnosis of vaginitis. Conclusions: The vaginal pH device can be used as an OTC diagnostic
  tool by consumers when a vaginal infection is suspected. Vaginal pH readings would direct patients whether
  to purchase an antifungal medication or seek professional diagnosis from a healthcare provider. Understanding
  and use of this vaginal pH device could reduce inappropriate use of OTC antifungal medications by approximately
  50% and improve the correct diagnosis of vaginitis.'
